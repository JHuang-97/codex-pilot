name: PilotApp

options:
  bundleIdPrefix: com.junhao-h
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  PilotCore:
    path: .

targets:
  PilotKit:
    type: application
    platform: iOS
    sources:
      - path: PilotApp
    dependencies:
      - package: PilotCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 2TJBL37P93
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: PilotApp/Info.plist
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.junhao-h.pilotkit
        PRODUCT_MODULE_NAME: PilotKit
        PRODUCT_NAME: PilotKit
        TARGETED_DEVICE_FAMILY: 1

schemes:
  PilotKit:
    build:
      targets:
        PilotKit: all
    run:
      config: Debug
    archive:
      config: Release
